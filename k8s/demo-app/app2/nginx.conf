server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /app2 {
    try_files /app2/index.html =404;
  }
  location ~* ^/app2/.*\.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    try_files $uri =404;
  }
  location /app2/ {
    try_files $uri $uri/ /app2/index.html;
  }
  location / {
    return 404;
  }
}
