# Matched to Traefik Helm chart 41.6.0 (see deploy.sh).
fullnameOverride: demo-traefik
deployment:
  replicas: 1
service:
  # Chart 41.x puts Kubernetes Service fields under service.spec.
  spec:
    type: ClusterIP
ingressClass:
  enabled: true
  isDefaultClass: false
  name: demo-traefik
providers:
  kubernetesIngress:
    enabled: true
    namespaces:
      - demo
    strictPrefixMatching: true
    publishedService:
      enabled: false
  kubernetesCRD:
    enabled: false
  kubernetesGateway:
    enabled: false
  kubernetesIngressNGINX:
    enabled: false
api:
  dashboard: false
  insecure: false
ingressRoute:
  dashboard:
    enabled: false
ports:
  web:
    port: 8000
    exposedPort: 80
    expose:
      default: true
  websecure:
    expose:
      default: false
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
log:
  level: INFO
accessLog:
  enabled: true
