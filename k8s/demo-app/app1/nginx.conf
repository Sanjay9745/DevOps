server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Serve the bare prefix directly, without a redirect that could lose port 8080.
  location = /app1 {
    try_files /app1/index.html =404;
  }
  # Assets must exist; never return HTML for a missing stylesheet or script.
  location ~* ^/app1/.*\.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    try_files $uri =404;
  }
  # Nested client-side routes resolve to the application shell.
  location /app1/ {
    try_files $uri $uri/ /app1/index.html;
  }
  location / {
    return 404;
  }
}
